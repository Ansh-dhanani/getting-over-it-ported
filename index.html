<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>getting over it</title>
  <meta name="description" content="getting over it - unity 6 webgl port">
  <style>
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
    #unity-container { position: fixed; inset: 0; }
    #unity-fullscreen-container { position: absolute; width: 100%; height: 100%; }
    #unity-canvas { display: block; width: 100%; height: 100%; }
    #unity-loading-container {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #000; gap: 14px;
    }
    #unity-logo { width: 160px; height: 160px; border-radius: 50%; object-fit: cover; }
    #unity-progress-shell {
      width: 280px; height: 2px; background: #222;
    }
    #unity-progress-bar {
      height: 100%; width: 0%; background: #888; transition: width 0.2s;
    }
    #unity-status { font: 12px/1.2 system-ui, sans-serif; color: #888; letter-spacing: 0.1em; }
    #unity-warning { position: fixed; top: 8px; right: 8px; max-width: 320px; font: 11px/1.4 system-ui, sans-serif; color: #ffb3b3; background: #300; padding: 6px 10px; border-radius: 3px; display: none; }
  </style>
</head>
<body>
<div id="unity-container">
  <div id="unity-fullscreen-container">
    <canvas id="unity-canvas" width="1280" height="720" tabindex="-1"></canvas>
    <div id="unity-loading-container"><img id="unity-logo" src="logo.jpg" alt=""><div id="unity-progress-shell"><div id="unity-progress-bar"></div></div><div id="unity-status">Loading</div></div>
  </div>
  <div id="unity-warning"></div>
</div>
<script>
  var BASE = new URL('./', window.location.href);

  var canvas = document.querySelector("#unity-canvas");
  var fullscreenContainer = document.querySelector("#unity-fullscreen-container");
  var progressBar = document.querySelector("#unity-progress-bar");
  var statusEl = document.querySelector("#unity-status");

  function fit() {
    fullscreenContainer.style.width = window.innerWidth + "px";
    fullscreenContainer.style.height = window.innerHeight + "px";
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
  }
  fit();
  window.addEventListener("resize", fit);

  var PARTS = [
    { name: "parts/data.part1", size: 72622855 },
    { name: "parts/data.part2", size: 72622855 },
  ];

  var loaderUrl = BASE + "u6_mian_brotli.loader.js";
  var frameworkUrl = BASE + "u6_mian_brotli.framework.js.unityweb";
  var codeUrl = BASE + "u6_mian_brotli.wasm.unityweb";

  var TOTAL = 111155 + 73924 + 8921558 + 145245710;
  var SEGMENTS = [
    { upto: (111155) / TOTAL, name: "loader.js" },
    { upto: (111155 + 73924) / TOTAL, name: "framework.js.unityweb" },
    { upto: (111155 + 73924 + 8921558) / TOTAL, name: "wasm.unityweb" },
    { upto: 1.0, name: "data.unityweb" }
  ];

  function setStatus(pct) {
    var n = Math.max(0, Math.min(100, Math.round(pct * 100)));
    progressBar.style.width = n + "%";
    var active = "data";
    for (var i = 0; i < SEGMENTS.length; i++) {
      if (pct <= SEGMENTS[i].upto + 0.0001) { active = SEGMENTS[i].name; break; }
    }
    statusEl.textContent = "Connecting to asset host";
  }

  // Fetch the two data parts in parallel; concatenate into a Blob the Unity WebGL runtime can consume.
  function fetchParts() {
    var downloaded = 0;
    return Promise.all(PARTS.map(function(p) {
      return fetch(BASE + p.name).then(function(res) {
        if (!res.ok) throw new Error("part fetch failed: " + p.name + " HTTP " + res.status);
        if (!res.body) throw new Error("part fetch: no streamed body for " + p.name);
        var reader = res.body.getReader();
        var chunks = [];
        var n = 0;
        return (function pump() {
          return reader.read().then(function(r) {
            if (r.done) return new Blob(chunks);
            chunks.push(r.value);
            n = (n += r.value.byteLength) / p.size;
            // Bump the progress bar manually based on bytes vs part size.
            var pct = (downloaded + n) / 2 || 0;
            // Unity will re-emit progress afterwards; this is a rough visual.
            progressBar.style.width = Math.min(99, Math.round(100 * (1 - 0.19) * (downloaded/2 + n/2))) + "px";
            return pump();
          });
        })();
      });
    })).then(function(blobs) {
      downloaded = 1;
      return new Blob(blobs, { type: "application/octet-stream" });
    });
  }

  function boot(dataUrl) {
    var config = {
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
      arguments: [],
      dataUrl: dataUrl,
      frameworkUrl: frameworkUrl,
      codeUrl: codeUrl,
      streamingAssetsUrl: "StreamingAssets",
      fullscreenElementID: "unity-fullscreen-container",
      companyName: "Bennett Foddy",
      productName: "Getting Over It",
      productVersion: "1.7",
      showBanner: function(msg, type) {
        var el = document.querySelector("#unity-warning");
        el.style.display = "block";
        el.textContent = msg;
        setTimeout(function(){ el.style.display = "none"; }, 6000);
      },
    };

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function() {
      var loading = document.querySelector("#unity-loading-container");
      createUnityInstance(canvas, config, setStatus).then(function() {
        loading.style.display = "none";
      }).catch(function(message) {
        statusEl.textContent = "Connecting to asset host";
      });
    };
    script.onerror = function() {
      statusEl.textContent = "Connecting to asset host";
    };
    document.body.appendChild(script);
  }

  // Load framework + wasm first (Unity loader handles them), only fetch parts to feed dataUrl.
  statusEl.textContent = "Connecting to asset host";
  fetchParts().then(function(blob) {
    var url = URL.createObjectURL(blob);
    statusEl.textContent = "Connecting to asset host";
    boot(url);
  }).catch(function(err) {
    statusEl.textContent = "Connecting to asset host";
  });
</script>
</body>
</html>
