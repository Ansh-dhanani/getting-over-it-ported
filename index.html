<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>getting over it</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <meta name="description" content="getting over it - unity 6 webgl port">
  <style>
    :root {
      --ink: #f4f4f4;
      --ink-2: #a8a8a8;
      --ink-3: #5e5e5e;
      --track: #1c1c1c;
      --bg: #000;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%; margin: 0; background: var(--bg); overflow: hidden;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }

    #unity-container { position: fixed; inset: 0; }
    #unity-fullscreen-container { position: absolute; inset: 0; }
    #unity-canvas { display: block; width: 100%; height: 100%; background: var(--bg); }

    /* ---------- loading ---------- */
    #unity-loading-container {
      position: absolute; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: var(--bg); user-select: none;
      opacity: 0; transition: opacity .55s ease;
    }
    #unity-loading-container.in { opacity: 1; }
    #unity-loading-container.out { opacity: 0; pointer-events: none; }

    .loader-mark {
      width: 88px; height: 88px; border-radius: 50%;
      object-fit: cover; opacity: .82;
      margin-bottom: 26px;
    }

    .loader-title {
      font: 500 10px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: .42em; text-indent: .42em; text-transform: uppercase;
      color: var(--ink-3); margin-bottom: 34px;
    }

    .loader-track {
      width: min(300px, 62vw); height: 1px;
      background: var(--track); border-radius: 1px;
      overflow: hidden; margin-bottom: 18px;
    }
    .loader-fill {
      height: 100%; width: 0%; background: var(--ink);
      transition: width .3s cubic-bezier(.22,.61,.36,1);
    }
    .loader-track.indeterminate .loader-fill {
      width: 30% !important;
      animation: glide 1.25s cubic-bezier(.65,0,.35,1) infinite;
    }
    @keyframes glide {
      0%   { transform: translateX(-120%); }
      100% { transform: translateX(340%); }
    }

    .loader-line {
      height: 18px; display: flex; align-items: center; gap: 10px;
      font: 400 11px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: .06em; color: var(--ink-2);
      font-variant-numeric: tabular-nums;
    }
    .loader-line .dot { width: 2px; height: 2px; border-radius: 50%; background: var(--ink-3); }

    .loader-meta {
      height: 16px; margin-top: 9px;
      font: 400 10px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .04em; color: var(--ink-3);
      font-variant-numeric: tabular-nums;
    }

    #unity-warning {
      position: fixed; top: 12px; right: 12px; max-width: 320px;
      font: 11px/1.5 system-ui, sans-serif; color: #ffb4b4;
      background: #1a0b0b; border: 1px solid #2a1414;
      padding: 8px 12px; border-radius: 4px; display: none; z-index: 20;
    }

    /* ---------- leaderboard ---------- */
    .lb-open {
      position: fixed; top: 14px; right: 14px; z-index: 30;
      font: 500 10px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: .34em; text-indent: .34em; text-transform: uppercase;
      color: var(--ink-2); background: rgba(10,10,10,.55);
      border: 1px solid #222; border-radius: 3px;
      padding: 9px 13px; cursor: pointer; backdrop-filter: blur(6px);
      opacity: .6; transition: opacity .2s ease, color .2s ease;
    }
    .lb-open:hover { opacity: 1; color: var(--ink); }

    .lb-backdrop { position: fixed; inset: 0; z-index: 39; background: rgba(0,0,0,.35); display: none; }
    .lb-backdrop.in { display: block; }

    .lb-panel {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 40;
      width: min(360px, 94vw); background: #0b0b0b;
      border-left: 1px solid #1e1e1e; display: flex; flex-direction: column;
      transform: translateX(101%); transition: transform .32s cubic-bezier(.22,.61,.36,1);
      visibility: hidden;
    }
    .lb-panel.in { transform: none; visibility: visible; }

    .lb-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 12px; }
    .lb-title {
      font: 500 10px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: .42em; text-indent: .42em; text-transform: uppercase; color: var(--ink-3);
    }
    .lb-close { background: none; border: none; color: var(--ink-3); font-size: 22px; line-height: 1; padding: 2px 8px; cursor: pointer; }
    .lb-close:hover { color: var(--ink); }

    .lb-save { display: none; padding: 0 20px; }
    .lb-save.on { display: block; }
    .lb-save-label { font: 400 10px/1.5 system-ui, sans-serif; letter-spacing: .08em; color: var(--ink-2); margin-bottom: 7px; }
    .lb-row-input { display: flex; gap: 8px; }
    .lb-input {
      flex: 1; background: #141414; border: 1px solid #262626; color: var(--ink);
      font: 400 13px system-ui, sans-serif; padding: 9px 10px; border-radius: 3px; outline: none;
    }
    .lb-input:focus { border-color: #3d3d3d; }
    .lb-btn-primary {
      background: #e8e8e8; color: #0a0a0a; border: none; border-radius: 3px;
      font: 600 11px system-ui, sans-serif; letter-spacing: .14em; text-indent: .14em; text-transform: uppercase;
      padding: 0 16px; cursor: pointer;
    }
    .lb-btn-primary:hover { background: #fff; }

    .lb-status { min-height: 16px; padding: 6px 20px 0; font: 400 10px/1.5 system-ui, sans-serif; letter-spacing: .06em; color: var(--ink-3); }
    .lb-status.good { color: #7ddba4; }
    .lb-status.bad { color: #ff9c9c; }

    .lb-list { flex: 1; overflow-y: auto; padding: 12px 0 8px; border-top: 1px solid #161616; }
    .lb-entry { display: flex; align-items: baseline; gap: 14px; padding: 9px 20px; font: 400 12px/1.3 system-ui, sans-serif; }
    .lb-entry:nth-child(odd) { background: #101010; }
    .lb-rank { width: 34px; flex: none; text-align: right; color: var(--ink-3); font-variant-numeric: tabular-nums; }
    .lb-name { flex: 1; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-time { color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .lb-entry.top .lb-rank { color: var(--ink); }
    .lb-empty, .lb-loading { padding: 26px 20px; color: var(--ink-3); font: 400 11px/1.7 system-ui, sans-serif; letter-spacing: .04em; }

    .lb-foot { padding: 12px 20px 18px; border-top: 1px solid #161616;
      font: 400 9px/1.7 system-ui, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
    .lb-foot-change { background: none; border: none; color: var(--ink-2); cursor: pointer; font: inherit; letter-spacing: inherit; text-transform: inherit; padding: 0; text-decoration: underline; }
    .lb-foot-change:hover { color: var(--ink); }

    .lb-pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 20px 4px; border-top: 1px solid #161616; }
    .lb-pager-btn { background: none; border: none; color: var(--ink-2); font: 500 10px/1 system-ui, sans-serif; letter-spacing: .18em; text-transform: uppercase; padding: 8px 10px; cursor: pointer; }
    .lb-pager-btn:hover { color: var(--ink); }
    .lb-pager-btn[disabled] { color: var(--ink-3); cursor: default; opacity: .45; }
    .lb-page-label { font: 400 10px/1 system-ui, sans-serif; letter-spacing: .12em; color: var(--ink-3); font-variant-numeric: tabular-nums; }
    .lb-total { padding: 2px 20px 10px; font: 400 9px/1 system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }

    .lb-toast {
      position: fixed; left: 50%; bottom: 26px; z-index: 45;
      transform: translate(-50%, 8px); opacity: 0; pointer-events: none;
      background: #111; border: 1px solid #2a2a2a; color: var(--ink);
      font: 400 11px/1.4 system-ui, sans-serif; padding: 9px 18px; border-radius: 999px;
      transition: opacity .25s ease, transform .25s ease;
    }
    .lb-toast.in { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 520px) {
      .loader-mark { width: 68px; height: 68px; margin-bottom: 22px; }
      .loader-title { margin-bottom: 26px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #unity-loading-container, .loader-fill { transition: none; }
      .loader-track.indeterminate .loader-fill { animation-duration: 2.5s; }
    }
  </style>

<body>
<div id="unity-container">
  <div id="unity-fullscreen-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="unity-loading-container">
      <img class="loader-mark" src="logo.jpg" alt="">
      <div class="loader-title">getting over it</div>
      <div class="loader-track"><div class="loader-fill"></div></div>
      <div class="loader-line">
        <span id="unity-status">checking</span>
      </div>
      <div class="loader-meta" id="unity-substatus"></div>
    </div>
  </div>
  <div id="unity-warning"></div>
</div>
<button id="lb-open" class="lb-open" type="button">fastest clears</button>
<div id="lb-backdrop" class="lb-backdrop"></div>
<aside id="lb-panel" class="lb-panel" role="dialog" aria-modal="true" aria-label="Fastest clears leaderboard">
  <div class="lb-head">
    <div class="lb-title">fastest clears</div>
    <button id="lb-close" class="lb-close" type="button" aria-label="Close">&times;</button>
  </div>
  <div id="lb-save" class="lb-save">
    <div class="lb-save-label">Run complete - add yourself to the board</div>
    <form id="lb-save-form" class="lb-row-input">
      <input id="lb-name" class="lb-input" type="text" maxlength="18" autocomplete="off" spellcheck="false" placeholder="nickname">
      <button id="lb-submit" class="lb-btn-primary" type="submit">Save</button>
    </form>
  </div>
  <div id="lb-status" class="lb-status"></div>
  <div id="lb-list" class="lb-list"><div class="lb-loading">loading&hellip;</div></div>
  <div class="lb-pager">
    <button id="lb-prev" class="lb-pager-btn" type="button">&larr; prev</button>
    <div id="lb-page-label" class="lb-page-label">page 1 / 1</div>
    <button id="lb-next" class="lb-pager-btn" type="button">next &rarr;</button>
  </div>
  <div id="lb-total" class="lb-total">0 entries</div>
  <div class="lb-foot">full clear &middot; start to finish<br>you are <button id="lb-change" class="lb-foot-change" type="button">anonymous</button> - tap to change</div>
</aside>
<div id="lb-toast" class="lb-toast"></div>
<script>
  var BASE = new URL("./", window.location.href);

  var canvas = document.querySelector("#unity-canvas");
  var fullscreenContainer = document.querySelector("#unity-fullscreen-container");
  var loadingEl = document.querySelector("#unity-loading-container");
  var trackEl = document.querySelector(".loader-track");
  var fillEl = document.querySelector(".loader-fill");
  var statusEl = document.querySelector("#unity-status");
  var subEl = document.querySelector("#unity-substatus");

  function log() {
    try {
      console.log.apply(console, ["[goi]"].concat(Array.prototype.slice.call(arguments)));
    } catch (e) {}
  }

  // Canvas is exactly the viewport; Unity owns the drawing buffer.
  function fit() {
    var w = window.innerWidth;
    var h = window.innerHeight;
    fullscreenContainer.style.width = w + "px";
    fullscreenContainer.style.height = h + "px";
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
  }
  fit();
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", fit);

  // ---- constants ---------------------------------------------------------
  var PART_NAMES = ["parts/mp6.part1", "parts/mp6.part2"];
  var PART_SIZES = [72636074, 72636074];
  var TOTAL_BYTES = PART_SIZES[0] + PART_SIZES[1];
  var SIZE_MB = (TOTAL_BYTES / (1024 * 1024)).toFixed(1);

  var DATA_BUILD = "mp6-2026-11-08";  // bump when game files change
  var IDB_NAME = "goi-archive";
  var IDB_STORE = "files";
  var IDB_DATA_KEY = "data:" + DATA_BUILD;
  var IDB_CHUNK_NS = "chunk:" + DATA_BUILD + ":";
  var CHUNK_SIZE = 2 * 1024 * 1024;   // 2 MiB resumable chunks
  var CONCURRENCY = 4;                // parallel range requests per part

  var PART_URLS = PART_NAMES.map(function (n) { return new URL(n, BASE).href; });
  var PART_FETCH_URLS = PART_NAMES.map(function (n) {
    return new URL(n + "?v=" + encodeURIComponent(DATA_BUILD), BASE).href;
  });

  var loaderUrl = BASE + "u6_mian_mp6.loader.js";
  var frameworkUrl = BASE + "u6_mian_mp6.framework.js.unityweb";
  var codeUrl = BASE + "u6_mian_mp6.wasm.unityweb";

  // ---- leaderboard (fastest full clear) --------------------------------
  var LB_API = BASE + "api/leaderboard";
  var LB_NAME_KEY = "goi-lb-name";

  var lbOpenBtn = document.getElementById("lb-open");
  var lbPanel = document.getElementById("lb-panel");
  var lbBackdrop = document.getElementById("lb-backdrop");
  var lbCloseBtn = document.getElementById("lb-close");
  var lbList = document.getElementById("lb-list");
  var lbStatus = document.getElementById("lb-status");
  var lbSaveRow = document.getElementById("lb-save");
  var lbSaveForm = document.getElementById("lb-save-form");
  var lbNameInput = document.getElementById("lb-name");
  var lbChangeBtn = document.getElementById("lb-change");
  var lbToastEl = document.getElementById("lb-toast");
  var lbPrevBtn = document.getElementById("lb-prev");
  var lbNextBtn = document.getElementById("lb-next");
  var lbPageLabel = document.getElementById("lb-page-label");
  var lbTotalEl = document.getElementById("lb-total");

  var lbPendingMs = null;
  var lbPage = 1;

  function lbPad(n, len) { n = String(n); while (n.length < len) n = "0" + n; return n; }
  function lbFmtMs(ms) {
    var total = ms / 1000, s = Math.floor(total), rem = Math.floor((total - s) * 1000);
    var m = Math.floor(s / 60), r = s % 60;
    if (m >= 60) { var h = Math.floor(m / 60); m = m % 60; return h + ":" + lbPad(m, 2) + ":" + lbPad(r, 2) + "." + lbPad(rem, 3); }
    return m + ":" + lbPad(r, 2) + "." + lbPad(rem, 3);
  }
  function lbEsc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function lbStoredName() {
    try { return localStorage.getItem(LB_NAME_KEY) || ""; } catch (e) { return ""; }
  }
  function lbStoreName(name) {
    try { localStorage.setItem(LB_NAME_KEY, name); } catch (e) {}
  }
  function lbSetStatus(msg, cls) {
    lbStatus.textContent = msg || "";
    lbStatus.className = "lb-status" + (cls ? " " + cls : "");
  }
  function lbToast(msg) {
    lbToastEl.textContent = msg;
    lbToastEl.classList.add("in");
    setTimeout(function () { lbToastEl.classList.remove("in"); }, 3400);
  }
  function lbUpdateFooter() {
    var n = lbStoredName();
    lbChangeBtn.textContent = n ? n : "anonymous";
  }
  function lbRender(top, page, perPage) {
    if (!top || !top.length) {
      lbList.innerHTML = '<div class="lb-empty">No clears yet.<br>Finish the climb and your name lands here first.</div>';
      return;
    }
    var offset = (page - 1) * perPage;
    var html = "";
    for (var i = 0; i < top.length; i++) {
      var e = top[i];
      var rank = offset + i + 1;
      html += '<div class="lb-entry' + (rank <= 3 ? " top" : "") + '"><span class="lb-rank">' + rank +
              '</span><span class="lb-name">' + lbEsc(e.name) +
              '</span><span class="lb-time">' + lbFmtMs(e.ms) + "</span></div>";
    }
    lbList.innerHTML = html;
  }
  function lbRefresh(page) {
    if (typeof page === "number" && page >= 1 && page <= 1000) lbPage = page;
    lbList.innerHTML = '<div class="lb-loading">loading&hellip;</div>';
    fetch(LB_API + "?page=" + encodeURIComponent(lbPage), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.ok) throw new Error((d && d.error) || "leaderboard unavailable");
        var pages = d.pages || 1;
        lbPage = d.page || lbPage;
        lbPageLabel.textContent = "page " + lbPage + " / " + pages;
        lbTotalEl.textContent = (d.total || 0) + (d.total === 1 ? " entry" : " entries");
        lbPrevBtn.disabled = lbPage <= 1;
        lbNextBtn.disabled = lbPage >= pages;
        lbRender(d.top, lbPage, d.per_page || d.top.length);
      })
      .catch(function (err) {
        lbPageLabel.textContent = "";
        lbTotalEl.textContent = "";
        lbPrevBtn.disabled = true;
        lbNextBtn.disabled = true;
        lbList.innerHTML = '<div class="lb-empty">Leaderboard unavailable.<br>' + lbEsc(err && err.message ? err.message : "try again in a moment") + "</div>";
      });
  }
  lbPrevBtn.addEventListener("click", function () { if (lbPage > 1) lbRefresh(lbPage - 1); });
  lbNextBtn.addEventListener("click", function () { lbRefresh(lbPage + 1); });
  function lbOpen(saveMode) {
    lbPanel.classList.add("in");
    lbBackdrop.classList.add("in");
    lbSetStatus("", null);
    lbUpdateFooter();
    if (saveMode) {
      lbSaveRow.classList.add("on");
      lbNameInput.value = lbStoredName();
      setTimeout(function () { lbNameInput.focus(); }, 120);
    } else {
      lbSaveRow.classList.remove("on");
    }
    lbRefresh();
  }
  function lbClose() {
    lbPanel.classList.remove("in");
    lbBackdrop.classList.remove("in");
    lbSetStatus("", null);
  }
  function lbPost(name, ms) {
    lbSetStatus("saving\u2026", null);
    fetch(LB_API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name, ms: ms })
    }).then(function (r) { return r.json().then(function (d) { return { status: r.status, body: d }; }); })
      .then(function (res) {
        var d = res.body;
        if (!d || !d.ok) throw new Error((d && d.error) || ("HTTP " + res.status));
        lbStoreName(name);
        lbUpdateFooter();
        lbPendingMs = null;
        if (d.rank !== null && d.rank !== undefined) {
          lbSetStatus("saved - you are #" + (d.rank + 1), "good");
          lbToast("time saved \u00b7 #" + (d.rank + 1));
        } else {
          lbSetStatus("saved (outside the top list)", "good");
          lbToast("time saved");
        }
        lbSaveRow.classList.remove("on");
        lbRefresh();
      })
      .catch(function (err) {
        var msg = err && err.message ? err.message : "could not save time";
        lbSetStatus(msg, "bad");
        lbToast("could not save time");
      });
  }

  lbOpenBtn.addEventListener("click", function () { lbOpen(false); });
  lbCloseBtn.addEventListener("click", lbClose);
  lbBackdrop.addEventListener("click", lbClose);
  lbChangeBtn.addEventListener("click", function () { lbOpen(true); });
  lbSaveForm.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var name = (lbNameInput.value || "").replace(/\s+/g, " ").trim().slice(0, 18) || "Anonymous";
    if (lbPendingMs) { lbPost(name, lbPendingMs); }
    else { lbStoreName(name); lbUpdateFooter(); lbSetStatus("name updated", "good"); lbToast("name updated"); lbSaveRow.classList.remove("on"); }
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && lbPanel.classList.contains("in")) lbClose();
  });

  // The Unity build calls this at the moment a run is completed.
  window.GoiLeaderboard = {
    submitTime: function (ms) {
      var t = Math.round(Number(ms)) || 0;
      if (t < 60000) { log("leaderboard: ignoring implausible time", t); return; }
      try { if (document.pointerLockElement && document.exitPointerLock) document.exitPointerLock(); } catch (e) {}
      lbPendingMs = t;
      var stored = lbStoredName();
      if (stored) {
        lbPost(stored, t);
      } else {
        lbOpen(true);
      }
    },
    open: function () { lbOpen(false); },
    close: lbClose
  };

  // ---- loading UI --------------------------------------------------------
  var t0 = performance.now();
  var tickId = null;

  requestAnimationFrame(function () { loadingEl.classList.add("in"); });

  function secs() { return ((performance.now() - t0) / 1000).toFixed(1) + "s"; }
  function fmtMB(b) { return (b / (1024 * 1024)).toFixed(1) + " MB"; }

  function fmtTime(s) {
    if (!isFinite(s) || s <= 0) return null;
    s = Math.round(s);
    if (s < 60) return s + "s";
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m + "m " + (r < 10 ? "0" : "") + r + "s";
  }

  // status = the one quiet line; meta = the numbers underneath.
  function state(main, meta) {
    statusEl.textContent = main;
    if (meta !== undefined) subEl.textContent = meta || "";
  }

  function setSub(meta) { subEl.textContent = meta || ""; }

  function setBar(fraction) {
    trackEl.classList.remove("indeterminate");
    fillEl.style.width = (Math.max(0, Math.min(1, fraction)) * 100).toFixed(2) + "%";
  }

  function setIndeterminate() {
    trackEl.classList.add("indeterminate");
    fillEl.style.width = "";
  }

  function tick(fn) {
    stopTick();
    setSub(fn());
    tickId = setInterval(function () { setSub(fn()); }, 250);
  }

  function stopTick() {
    if (tickId) { clearInterval(tickId); tickId = null; }
  }

  function hideLoader() {
    stopTick();
    loadingEl.classList.add("out");
    setTimeout(function () { loadingEl.style.display = "none"; }, 600);
  }

  // ---- IndexedDB ---------------------------------------------------------
  var idbPromise = null;
  var idbOk = true;
  var memChunks = [[], []];

  function idbOpen() {
    if (!idbPromise) {
      idbPromise = new Promise(function (resolve, reject) {
        if (typeof indexedDB === "undefined") { reject(new Error("indexedDB unavailable")); return; }
        var req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = function () {
          var db = req.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
        };
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error || new Error("indexedDB open failed")); };
        req.onblocked = function () { reject(new Error("indexedDB blocked")); };
      });
    }
    return idbPromise;
  }

  function idbGet(key) {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(IDB_STORE, "readonly");
        var r = tx.objectStore(IDB_STORE).get(key);
        r.onsuccess = function () { resolve(r.result === undefined ? null : r.result); };
        r.onerror = function () { reject(r.error); };
      });
    });
  }

  function idbGetMany(keys) {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(IDB_STORE, "readonly");
        var st = tx.objectStore(IDB_STORE);
        var out = new Array(keys.length);
        keys.forEach(function (k, i) {
          var r = st.get(k);
          r.onsuccess = function () { out[i] = r.result || null; };
        });
        tx.oncomplete = function () { resolve(out); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }

  function idbPut(key, value) {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(IDB_STORE, "readwrite");
        tx.objectStore(IDB_STORE).put(value, key);
        tx.oncomplete = function () { resolve(true); };
        tx.onerror = function () { reject(tx.error); };
        tx.onabort = function () { reject(tx.error || new Error("transaction aborted")); };
      });
    });
  }

  function idbDelete(keys) {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(IDB_STORE, "readwrite");
        var st = tx.objectStore(IDB_STORE);
        keys.forEach(function (k) { st.delete(k); });
        tx.oncomplete = function () { resolve(true); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }

  function idbAllKeys() {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(IDB_STORE, "readonly");
        var r = tx.objectStore(IDB_STORE).getAllKeys();
        r.onsuccess = function () { resolve(r.result || []); };
        r.onerror = function () { reject(r.error); };
      });
    });
  }

  function cacheReady() {
    return (typeof caches !== "undefined") && (typeof Response !== "undefined") && window.isSecureContext;
  }

  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(function () {});
  }
  if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      regs.forEach(function (r) { r.unregister(); });
    }).catch(function () {});
  }

  // ---- stored archive ----------------------------------------------------
  function readIndexedArchive() {
    return idbGet(IDB_DATA_KEY).then(function (rec) {
      if (rec && rec.blob && rec.size === TOTAL_BYTES) return { blob: rec.blob, source: "IndexedDB" };
      if (rec) idbDelete([IDB_DATA_KEY]).catch(function () {});
      return null;
    }).catch(function (err) {
      log("IndexedDB read failed", err);
      return null;
    });
  }

  function readCacheStorageArchive() {
    if (!cacheReady()) return Promise.resolve(null);
    var archiveKey = new URL("__goi_game_data." + DATA_BUILD + ".bin", BASE).href;
    return caches.keys().then(function (names) {
      return Promise.all(names.map(function (name) {
        return caches.open(name).then(function (cache) {
          return Promise.all([
            cache.match(archiveKey),
            cache.match(PART_URLS[0], { ignoreSearch: true }),
            cache.match(PART_URLS[1], { ignoreSearch: true })
          ]).then(function (hits) {
            if (hits[0]) {
              return hits[0].blob().then(function (blob) {
                if (blob.size === TOTAL_BYTES) return { blob: blob, source: "Cache Storage" };
                return cache.delete(archiveKey).then(function () { return null; });
              });
            }
            if (hits[1] && hits[2]) {
              return Promise.all([hits[1].blob(), hits[2].blob()]).then(function (bs) {
                if (bs[0].size + bs[1].size !== TOTAL_BYTES) return null;
                return { blob: new Blob(bs, { type: "application/octet-stream" }), source: "saved parts" };
              });
            }
            return null;
          });
        }).catch(function () { return null; });
      })).then(function (results) {
        for (var i = 0; i < results.length; i++) if (results[i]) return results[i];
        return null;
      });
    }).catch(function () { return null; });
  }

  // ---- chunks ------------------------------------------------------------
  function partChunkCount(part) { return Math.ceil(PART_SIZES[part] / CHUNK_SIZE); }
  function chunkKey(part, i) { return IDB_CHUNK_NS + part + ":" + i; }
  function chunkExpectedSize(part, i) {
    return Math.min(PART_SIZES[part], (i + 1) * CHUNK_SIZE) - i * CHUNK_SIZE;
  }

  function existingChunks(part) {
    var count = partChunkCount(part);
    var keys = [];
    for (var i = 0; i < count; i++) keys.push(chunkKey(part, i));
    memChunks[part] = [];
    return idbGetMany(keys).then(function (recs) {
      var bytes = 0;
      var filled = 0;
      for (var i = 0; i < recs.length; i++) {
        var r = recs[i];
        if (!r || !r.byteLength || r.byteLength !== chunkExpectedSize(part, i)) break;
        memChunks[part].push(r);
        bytes += r.byteLength;
        filled++;
      }
      return { filled: filled, bytes: bytes };
    }).catch(function (err) {
      log("IndexedDB chunk read failed; resume disabled", err);
      idbOk = false;
      memChunks[part] = [];
      return { filled: 0, bytes: 0 };
    });
  }

  function storeChunk(part, idx, buf) {
    memChunks[part][idx] = buf;
    if (!idbOk) return Promise.resolve(false);
    return idbPut(chunkKey(part, idx), buf).catch(function (err) {
      log("IndexedDB chunk write failed; continuing without resume", err);
      idbOk = false;
      return false;
    });
  }

  function fetchRange(url, start, end, attempt) {
    attempt = attempt || 1;
    return fetch(url, { headers: { "Range": "bytes=" + start + "-" + end } })
      .then(function (res) {
        if (res.status === 206) return res.arrayBuffer();
        if (res.status === 200) {
          var err = new Error("server ignored Range");
          err.noRange = true;
          throw err;
        }
        throw new Error("HTTP " + res.status);
      })
      .catch(function (err) {
        if (err.noRange) throw err;
        if (attempt >= 3) throw err;
        return new Promise(function (r) { setTimeout(r, 300 * attempt); })
          .then(function () { return fetchRange(url, start, end, attempt + 1); });
      });
  }

  function downloadPartWhole(part, onProgress) {
    var size = PART_SIZES[part];
    var url = PART_FETCH_URLS[part];
    var count = partChunkCount(part);
    var have = 0;
    return fetch(url).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.arrayBuffer();
    }).then(function (buf) {
      var chain = Promise.resolve();
      for (var i = 0; i < count; i++) {
        (function (idx) {
          chain = chain.then(function () {
            var s = idx * CHUNK_SIZE;
            var e = Math.min(size, s + CHUNK_SIZE);
            var slice = buf.slice(s, e);
            return storeChunk(part, idx, slice).then(function () {
              have += slice.byteLength;
              onProgress(part, have, false);
            });
          });
        })(i);
      }
      return chain;
    });
  }

  function downloadPart(part, onProgress) {
    var size = PART_SIZES[part];
    var url = PART_FETCH_URLS[part];
    var count = partChunkCount(part);

    return existingChunks(part).then(function (st) {
      if (st.filled >= count) {
        onProgress(part, st.bytes, true);
        return;
      }

      var next = st.filled;
      var have = st.bytes;
      onProgress(part, have, next > 0);

      function worker() {
        if (next >= count) return Promise.resolve();
        var idx = next++;
        var start = idx * CHUNK_SIZE;
        var end = Math.min(size, start + CHUNK_SIZE) - 1;
        return fetchRange(url, start, end).then(function (buf) {
          return storeChunk(part, idx, buf).then(function () {
            have += buf.byteLength;
            onProgress(part, have, false);
            return worker();
          });
        });
      }

      var workers = [];
      for (var i = 0; i < CONCURRENCY; i++) workers.push(worker());

      return Promise.all(workers).catch(function (err) {
        if (err && err.noRange) {
          log("range requests unsupported — falling back to single stream");
          memChunks[part] = [];
          return downloadPartWhole(part, onProgress);
        }
        throw err;
      });
    });
  }

  function assembleArchive() {
    var parts = [0, 1].map(function (part) {
      var count = partChunkCount(part);
      var list = memChunks[part];
      if (list.length === count && list.every(function (b) { return b && b.byteLength; })) {
        return new Blob(list);
      }
      var keys = [];
      for (var i = 0; i < count; i++) keys.push(chunkKey(part, i));
      return idbGetMany(keys).then(function (recs) {
        if (recs.length !== count || recs.some(function (r) { return !r || !r.byteLength; })) {
          throw new Error("missing chunk data for part " + part);
        }
        return new Blob(recs);
      });
    });
    return Promise.all(parts).then(function (blobs) {
      return new Blob(blobs, { type: "application/octet-stream" });
    });
  }

  function persistArchive(blob) {
    return idbPut(IDB_DATA_KEY, { blob: blob, size: blob.size, build: DATA_BUILD, savedAt: Date.now() })
      .then(function () {
        log("archive stored (" + fmtMB(blob.size) + ")");
        if (cacheReady()) {
          var archiveKey = new URL("__goi_game_data." + DATA_BUILD + ".bin", BASE).href;
          caches.open("goi-data-v1").then(function (c) { c.delete(archiveKey); }).catch(function () {});
        }
        return true;
      })
      .catch(function (err) {
        log("IndexedDB store failed", err);
        return false;
      });
  }

  function clearChunks() {
    var cleanup = idbAllKeys().then(function (keys) {
      var doomed = keys.filter(function (k) { return typeof k === "string" && k.indexOf("chunk:") === 0; });
      if (doomed.length) return idbDelete(doomed);
    }).catch(function () {});
    return cleanup.then(function () { memChunks = [[], []]; });
  }

  // ---- boot --------------------------------------------------------------
  function boot(dataUrl, cached) {
    var config = {
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
      arguments: [],
      dataUrl: dataUrl,
      frameworkUrl: frameworkUrl,
      codeUrl: codeUrl,
      streamingAssetsUrl: "StreamingAssets",
      fullscreenElementID: "unity-fullscreen-container",
      companyName: "Bennett Foddy",
      productName: "Getting Over It",
      productVersion: "1.7",
      showBanner: function (msg) {
        var el = document.querySelector("#unity-warning");
        el.style.display = "block";
        el.textContent = msg;
        setTimeout(function () { el.style.display = "none"; }, 6000);
      }
    };

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      var startedEngine = performance.now();

      if (cached) {
        setIndeterminate();
        state("starting from saved copy", "no download · " + SIZE_MB + " MB");
        tick(function () { return "unpacking · " + secs(); });
      } else {
        setBar(1);
        state("starting", "engine · " + secs());
      }

      createUnityInstance(canvas, config, function (progress) {
        var n = Math.max(0, Math.min(100, Math.round(progress * 100)));
        if (cached) {
          state("unpacking", "no download · " + n + "%");
        } else {
          setBar(progress);
          state("starting", "engine · " + n + "%");
        }
      }).then(function () {
        stopTick();
        log("timeline: engine " + Math.round(performance.now() - startedEngine) + " ms · total " + secs());
        hideLoader();
      }).catch(function (message) {
        stopTick();
        setBar(0);
        state("failed to load", message);
      });
    };
    script.onerror = function () {
      stopTick();
      state("engine script unreachable", loaderUrl);
    };
    document.body.appendChild(script);
  }

  // ---- flow --------------------------------------------------------------
  function startFromCache(hit) {
    var lookupMs = Math.round(performance.now() - t0);
    setIndeterminate();
    state("saved copy found", SIZE_MB + " MB · cache " + lookupMs + " ms");
    log("cache HIT " + lookupMs + " ms · " + hit.source + " · " + fmtMB(hit.blob.size) + " · zero network requests");
    boot(URL.createObjectURL(hit.blob), true);
  }

  function startDownload() {
    var partBytes = [0, 0];
    var resumed = false;
    var samples = [];

    setBar(0);
    state("downloading", "0.0 MB of " + SIZE_MB + " MB");

    function speed() {
      if (samples.length < 2) return 0;
      var first = samples[0];
      var last = samples[samples.length - 1];
      var dt = (last.t - first.t) / 1000;
      return dt > 0 ? (last.b - first.b) / dt : 0;
    }

    var painter = setInterval(function () {
      var total = partBytes[0] + partBytes[1];
      var now = performance.now();
      samples.push({ t: now, b: total });
      while (samples.length > 2 && now - samples[0].t > 3000) samples.shift();

      var frac = Math.min(1, total / TOTAL_BYTES);
      setBar(frac);

      var sp = speed();
      var pct = Math.round(frac * 100);
      state((resumed ? "resuming" : "downloading") + " · " + pct + "%",
            fmtMB(total) + " of " + SIZE_MB + " MB" +
            (sp > 0 ? " · " + (sp / (1024 * 1024)).toFixed(1) + " MB/s · " + (fmtTime((TOTAL_BYTES - total) / sp) || "—") + " left" : ""));
    }, 250);

    function stopPainter() {
      if (painter) { clearInterval(painter); painter = null; }
    }

    return Promise.all([0, 1].map(function (part) {
      return downloadPart(part, function (p, bytes, wasResumed) {
        partBytes[p] = bytes;
        if (wasResumed && bytes > 0) resumed = true;
      });
    })).then(function () {
      stopPainter();
      setBar(1);
      state("preparing", fmtMB(TOTAL_BYTES) + " · saved for next time");
      return assembleArchive();
    }).then(function (blob) {
      if (blob.size !== TOTAL_BYTES) {
        throw new Error("assembled " + blob.size + " bytes, expected " + TOTAL_BYTES);
      }
      boot(URL.createObjectURL(blob), false);
      return persistArchive(blob).then(function (ok) {
        if (ok) {
          log("cache STORED — next load downloads nothing");
          clearChunks();
        } else {
          log("cache STORE FAILED — browser refused IndexedDB");
        }
      });
    }).catch(function (err) {
      stopPainter();
      setBar(0);
      state("download failed", (err && err.message ? err.message : String(err)) + " · reload to resume");
      log("download failed — chunks kept, reload to resume", err);
    });
  }

  // Preload the tiny engine script while the data streams in.
  try {
    var pre = document.createElement("link");
    pre.rel = "preload";
    pre.as = "script";
    pre.href = loaderUrl;
    document.head.appendChild(pre);
  } catch (e) {}

  log("build " + DATA_BUILD + " · " + (CHUNK_SIZE / (1024 * 1024)) + " MB chunks · " + CONCURRENCY + " parallel");

  setIndeterminate();
  state("checking", "saved game data");

  readIndexedArchive().then(function (hit) {
    return hit || readCacheStorageArchive();
  }).then(function (hit) {
    if (hit) return startFromCache(hit);
    return startDownload();
  }).catch(function (err) {
    setBar(0);
    state("startup failed", err && err.message ? err.message : String(err));
    log("startup failed", err);
  });
</script>
</body>
</html>
