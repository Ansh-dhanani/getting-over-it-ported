<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>getting over it</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <meta name="description" content="getting over it - unity 6 webgl port">
  <style>
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
    #unity-container { position: fixed; inset: 0; }
    #unity-fullscreen-container { position: absolute; width: 100%; height: 100%; }
    #unity-canvas { display: block; width: 100%; height: 100%; }
    #unity-loading-container {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #000; gap: 14px;
    }
    #unity-logo { width: 160px; height: 160px; border-radius: 50%; object-fit: cover; }
    #unity-progress-shell {
      width: 340px; height: 2px; background: #222;
    }
    #unity-progress-bar {
      height: 100%; width: 0%; background: #888; transition: width 0.15s linear;
    }
    #unity-status { font: 12px/1.3 system-ui, sans-serif; color: #888; letter-spacing: 0.08em; min-width: 340px; text-align: center; }
    #unity-cache-badge { position: fixed; left: 10px; bottom: 10px; z-index: 20;
      font: 11px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; color: #6c6;
      background: rgba(0,0,0,.65); border: 1px solid #222; padding: 4px 8px; border-radius: 3px; }
    #unity-warning { position: fixed; top: 8px; right: 8px; max-width: 320px; font: 11px/1.4 system-ui, sans-serif; color: #ffb3b3; background: #300; padding: 6px 10px; border-radius: 3px; display: none; }
  </style>
  <script defer src="https://stats.anshdhanani.is-a.dev/script.js" data-website-id="90edeac2-132f-4222-bef5-1a7abc400165"></script>
  <script defer src="https://stats.anshdhanani.is-a.dev/recorder.js" data-website-id="90edeac2-132f-4222-bef5-1a7abc400165"></script>
</head>
<body>
<div id="unity-container">
  <div id="unity-fullscreen-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-container">
      <img id="unity-logo" src="logo.jpg" alt="">
      <div id="unity-progress-shell"><div id="unity-progress-bar"></div></div>
      <div id="unity-status">Loading…</div>
    </div>
  </div>
  <div id="unity-warning"></div>
  <div id="unity-cache-badge">cache: checking…</div>
</div>
<script>
  var BASE = new URL("./", window.location.href);

  var canvas = document.querySelector("#unity-canvas");
  var fullscreenContainer = document.querySelector("#unity-fullscreen-container");
  var progressShell = document.querySelector("#unity-progress-shell");
  var progressBar = document.querySelector("#unity-progress-bar");
  var statusEl = document.querySelector("#unity-status");
  var loadingEl = document.querySelector("#unity-loading-container");
  var badgeEl = document.querySelector("#unity-cache-badge");

  function log() {
    try {
      var args = Array.prototype.slice.call(arguments);
      console.log.apply(console, ["[goi]"].concat(args));
    } catch (e) {}
  }

  function setBadge(text, color) {
    if (!badgeEl) return;
    badgeEl.textContent = text;
    badgeEl.style.color = color || "#6c6";
  }

  function fit() {
    var w = window.innerWidth, h = window.innerHeight;
    fullscreenContainer.style.width = w + "px";
    fullscreenContainer.style.height = h + "px";
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    canvas.width = w;
    canvas.height = h;
  }
  fit();
  window.addEventListener("resize", fit);

  var PART_NAMES = ["parts/data.part1", "parts/data.part2"];
  var PART_SIZES = [72622855, 72622855];
  var TOTAL_BYTES = PART_SIZES[0] + PART_SIZES[1];
  var PART_URLS = PART_NAMES.map(function (n) { return new URL(n, BASE).href; });

  // One single archive entry, so a repeat visit does zero network work.
  // Bump DATA_BUILD whenever the parts change: a cached archive from a
  // different build is ignored (and pruned) instead of booting stale data.
  var DATA_CACHE = "goi-data-v1";
  var DATA_BUILD = "brotli-2026-11-08";
  var DATA_KEY = new URL("__goi_game_data." + DATA_BUILD + ".bin", BASE).href;

  var loaderUrl = BASE + "u6_mian_brotli.loader.js";
  var frameworkUrl = BASE + "u6_mian_brotli.framework.js.unityweb";
  var codeUrl = BASE + "u6_mian_brotli.wasm.unityweb";

  function cacheReady() {
    return (typeof caches !== "undefined") && (typeof Response !== "undefined") && window.isSecureContext;
  }

  // Ask the browser to keep our archive instead of evicting it under disk pressure.
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(function () {});
  }
  // The old service worker is no longer used; retire any leftover registration so it
  // cannot re-download the parts behind our back.
  if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      regs.forEach(function (r) { r.unregister(); });
    }).catch(function () {});
  }

  function setDownloadStatus(bytesLoaded) {
    var pct = Math.min(100, Math.round((bytesLoaded / TOTAL_BYTES) * 100));
    progressBar.style.width = pct + "%";
    var mb = (bytesLoaded / (1024 * 1024)).toFixed(1);
    var total = (TOTAL_BYTES / (1024 * 1024)).toFixed(1);
    statusEl.textContent = "Downloading " + mb + " MB / " + total + " MB (" + pct + "%)";
  }

  function fetchOne(url, size, onChunk) {
    return fetch(url, { cache: "force-cache" }).then(function (res) {
      if (!res.ok) throw new Error("fetch " + url + " HTTP " + res.status);
      if (!res.body) throw new Error("fetch " + url + ": no stream");
      var reader = res.body.getReader();
      var chunks = [];
      var got = 0;
      return (function pump() {
        return reader.read().then(function (r) {
          if (r.done) return new Blob(chunks);
          chunks.push(r.value);
          got += r.value.byteLength;
          if (onChunk) onChunk(got, size);
          return pump();
        });
      })();
    });
  }

  function fetchPartsFromNetwork() {
    var loaded = [0, 0];
    progressShell.style.display = "";
    statusEl.textContent = "Connecting…";
    return Promise.all(PART_NAMES.map(function (name, i) {
      return fetchOne(PART_URLS[i], PART_SIZES[i], function (got) {
        loaded[i] = got;
        setDownloadStatus(loaded[0] + loaded[1]);
      });
    })).then(function (blobs) {
      return new Blob(blobs, { type: "application/octet-stream" });
    });
  }

  // Look through every cache for either our consolidated archive or the old
  // split parts (so existing visitors migrate without re-downloading anything).
  function findCachedData() {
    if (!cacheReady()) return Promise.resolve(null);
    return caches.keys().then(function (names) {
      return Promise.all(names.map(function (name) {
        return caches.open(name).then(function (cache) {
          return Promise.all([
            cache.match(DATA_KEY),
            cache.match(PART_URLS[0]),
            cache.match(PART_URLS[1])
          ]).then(function (hits) {
            var single = hits[0], a = hits[1], b = hits[2];

            // 1) Our consolidated archive. Accept it only when the byte count
            //    matches what this build expects; then boot with no download.
            if (single) {
              return single.blob().then(function (blob) {
                if (blob.size === TOTAL_BYTES) {
                  return { blob: blob, consolidated: true };
                }
                return caches.open(name).then(function (c) {
                  return c.delete(DATA_KEY);
                }).then(function () { return null; });
              });
            }

            // 2) Legacy split parts from the retired service worker: migrate
            //    them into the single archive without re-downloading.
            if (a && b) {
              return Promise.all([a.blob(), b.blob()]).then(function (bs) {
                if (bs[0].size + bs[1].size !== TOTAL_BYTES) return null;
                return {
                  blob: new Blob(bs, { type: "application/octet-stream" }),
                  consolidated: false
                };
              });
            }

            return null;
          });
        }).catch(function () { return null; });
      })).then(function (results) {
        for (var i = 0; i < results.length; i++) {
          if (results[i]) return results[i];
        }
        return null;
      });
    }).catch(function () { return null; });
  }

  function storeData(blob) {
    if (!cacheReady()) return Promise.resolve(false);
    return caches.open(DATA_CACHE).then(function (cache) {
      return cache.put(DATA_KEY, new Response(blob, {
        headers: { "Content-Type": "application/octet-stream" }
      }));
    }).then(function () {
      return true;
    }).catch(function (err) {
      console.warn("could not cache game data:", err);
      return false;
    });
  }

  // Drop archives belonging to other builds; keep only this build's entry.
  function pruneDataCache() {
    if (!cacheReady()) return Promise.resolve();
    return caches.open(DATA_CACHE).then(function (cache) {
      return cache.keys().then(function (reqs) {
        return Promise.all(reqs.map(function (req) {
          if (req.url !== DATA_KEY) return cache.delete(req);
        }));
      });
    }).catch(function () {});
  }

  // Only remove the old split-part cache once the single archive is safely stored.
  function dropLegacyCaches() {
    if (!cacheReady()) return Promise.resolve();
    return caches.keys().then(function (names) {
      return Promise.all(names.map(function (name) {
        if (name !== DATA_CACHE) return caches.delete(name);
      }));
    }).catch(function () {});
  }

  function boot(dataUrl) {
    var config = {
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
      arguments: [],
      dataUrl: dataUrl,
      frameworkUrl: frameworkUrl,
      codeUrl: codeUrl,
      streamingAssetsUrl: "StreamingAssets",
      fullscreenElementID: "unity-fullscreen-container",
      companyName: "Bennett Foddy",
      productName: "Getting Over It",
      productVersion: "1.7",
      showBanner: function (msg) {
        var el = document.querySelector("#unity-warning");
        el.style.display = "block";
        el.textContent = msg;
        setTimeout(function () { el.style.display = "none"; }, 6000);
      }
    };

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      statusEl.textContent = "Starting…";
      progressBar.style.width = "100%";
      createUnityInstance(canvas, config, function (progress) {
        var n = Math.max(0, Math.min(100, Math.round(progress * 100)));
        progressBar.style.width = n + "%";
        statusEl.textContent = "Starting… " + n + "%";
      }).then(function () {
        loadingEl.style.display = "none";
        setTimeout(function () { if (badgeEl) badgeEl.style.display = "none"; }, 8000);
      }).catch(function (message) {
        statusEl.textContent = "Failed to load: " + message;
      });
    };
    script.onerror = function () {
      statusEl.textContent = "loader.js unreachable from " + loaderUrl;
    };
    document.body.appendChild(script);
  }

  var SIZE_MB = (TOTAL_BYTES / (1024 * 1024)).toFixed(1);
  var startedAt = performance.now();

  function startFromCached(cached) {
    // No download to report: hide the byte bar so it never shows 0 MB.
    progressShell.style.display = "none";
    statusEl.textContent = "Loaded from cache — starting…";
    setBadge("cache: HIT · " + SIZE_MB + " MB · no download");
    log("cache HIT in " + Math.round(performance.now() - startedAt) + " ms · " + SIZE_MB + " MB · zero network requests");
    boot(URL.createObjectURL(cached.blob));
    if (!cached.consolidated) {
      storeData(cached.blob).then(function (ok) {
        if (ok) { dropLegacyCaches(); pruneDataCache(); }
      });
    }
  }

  function startFromNetwork() {
    setBadge("cache: MISS — downloading " + SIZE_MB + " MB", "#e0b050");
    log("cache MISS — first visit or cache cleared; downloading " + SIZE_MB + " MB");
    return fetchPartsFromNetwork().then(function (blob) {
      var url = URL.createObjectURL(blob);
      boot(url);
      // Persist after boot starts so the player sees the game as soon as possible.
      storeData(blob).then(function (ok) {
        if (ok) {
          dropLegacyCaches();
          pruneDataCache();
          setBadge("cache: STORED · " + SIZE_MB + " MB · next load is instant");
          log("cache STORED · next load will not download");
        } else {
          setBadge("cache: STORE FAILED — will re-download", "#e06060");
          log("cache STORE FAILED — this browser refused to persist the archive");
        }
      });
    }).catch(function (err) {
      statusEl.textContent = "Download failed: " + (err && err.message ? err.message : String(err));
    });
  }

  if (!cacheReady()) {
    setBadge("cache: unavailable in this context", "#e0b050");
    log("Cache Storage unavailable (needs HTTPS; some private windows block persistence)");
  }
  log("build " + DATA_BUILD + " · archive key " + DATA_KEY);

  findCachedData().then(function (cached) {
    if (cached) {
      startFromCached(cached);
    } else {
      return startFromNetwork();
    }
  }).catch(function (err) {
    statusEl.textContent = "Startup failed: " + (err && err.message ? err.message : String(err));
  });
</script>
</body>
</html>
