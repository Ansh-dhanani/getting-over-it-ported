<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>getting over it</title>
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  <meta name="description" content="getting over it - unity 6 webgl port">
  <style>
    :root {
      --ink: #f4f4f4;
      --ink-2: #a8a8a8;
      --ink-3: #5e5e5e;
      --track: #1c1c1c;
      --bg: #000;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%; margin: 0; background: var(--bg); overflow: hidden;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }

    #unity-container { position: fixed; inset: 0; }
    #unity-fullscreen-container { position: absolute; inset: 0; }
    #unity-canvas { display: block; width: 100%; height: 100%; background: var(--bg); }

    /* ---------- loading ---------- */
    #unity-loading-container {
      position: absolute; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: var(--bg); user-select: none;
      opacity: 0; transition: opacity .55s ease;
    }
    #unity-loading-container.in { opacity: 1; }
    #unity-loading-container.out { opacity: 0; pointer-events: none; }

    .loader-mark {
      width: 88px; height: 88px; border-radius: 50%;
      object-fit: cover; opacity: .82;
      margin-bottom: 26px;
    }

    .loader-title {
      font: 500 10px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: .42em; text-indent: .42em; text-transform: uppercase;
      color: var(--ink-3); margin-bottom: 34px;
    }

    .loader-track {
      width: min(300px, 62vw); height: 1px;
      background: var(--track); border-radius: 1px;
      overflow: hidden; margin-bottom: 18px;
    }
    .loader-fill {
      height: 100%; width: 0%; background: var(--ink);
      transition: width .3s cubic-bezier(.22,.61,.36,1);
    }
    .loader-track.indeterminate .loader-fill {
      width: 30% !important;
      animation: glide 1.25s cubic-bezier(.65,0,.35,1) infinite;
    }
    @keyframes glide {
      0%   { transform: translateX(-120%); }
      100% { transform: translateX(340%); }
    }

    .loader-line {
      height: 18px; display: flex; align-items: center; gap: 10px;
      font: 400 11px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: .06em; color: var(--ink-2);
      font-variant-numeric: tabular-nums;
    }
    .loader-line .dot { width: 2px; height: 2px; border-radius: 50%; background: var(--ink-3); }

    .loader-meta {
      height: 16px; margin-top: 9px;
      font: 400 10px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .04em; color: var(--ink-3);
      font-variant-numeric: tabular-nums;
    }

    #unity-warning {
      position: fixed; top: 12px; right: 12px; max-width: 320px;
      font: 11px/1.5 system-ui, sans-serif; color: #ffb4b4;
      background: #1a0b0b; border: 1px solid #2a1414;
      padding: 8px 12px; border-radius: 4px; display: none; z-index: 20;
    }

    @media (max-width: 520px) {
      .loader-mark { width: 68px; height: 68px; margin-bottom: 22px; }
      .loader-title { margin-bottom: 26px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #unity-loading-container, .loader-fill { transition: none; }
      .loader-track.indeterminate .loader-fill { animation-duration: 2.5s; }
    }
  </style>
  <script defer src="https://stats.anshdhanani.is-a.dev/script.js" data-website-id="90edeac2-132f-4222-bef5-1a7abc400165"></script>
  <script defer src="https://stats.anshdhanani.is-a.dev/recorder.js" data-website-id="90edeac2-132f-4222-bef5-1a7abc400165"></script>
</head>
<body>
<div id="unity-container">
  <div id="unity-fullscreen-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="unity-loading-container">
      <img class="loader-mark" src="logo.jpg" alt="">
      <div class="loader-title">getting over it</div>
      <div class="loader-track"><div class="loader-fill"></div></div>
      <div class="loader-line">
        <span id="unity-status">checking</span>
      </div>
      <div class="loader-meta" id="unity-substatus"></div>
    </div>
  </div>
  <div id="unity-warning"></div>
</div>
<script>
  var BASE = new URL("./", window.location.href);

  var canvas = document.querySelector("#unity-canvas");
  var fullscreenContainer = document.querySelector("#unity-fullscreen-container");
  var loadingEl = document.querySelector("#unity-loading-container");
  var trackEl = document.querySelector(".loader-track");
  var fillEl = document.querySelector(".loader-fill");
  var statusEl = document.querySelector("#unity-status");
  var subEl = document.querySelector("#unity-substatus");

  function log() {
    try {
      console.log.apply(console, ["[goi]"].concat(Array.prototype.slice.call(arguments)));
    } catch (e) {}
  }

  // Canvas is exactly the viewport; Unity owns the drawing buffer.
  function fit() {
    var w = window.innerWidth;
    var h = window.innerHeight;
    fullscreenContainer.style.width = w + "px";
    fullscreenContainer.style.height = h + "px";
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
  }
  fit();
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", fit);

  // ---- constants ---------------------------------------------------------
  var PART_NAMES = ["parts/data.part1", "parts/data.part2"];
  var PART_SIZES = [72622855, 72622855];
  var TOTAL_BYTES = PART_SIZES[0] + PART_SIZES[1];
  var SIZE_MB = (TOTAL_BYTES / (1024 * 1024)).toFixed(1);

  var DATA_BUILD = "brotli-2026-11-08";  // bump when game files change
  var IDB_NAME = "goi-archive";
  var IDB_STORE = "files";
  var IDB_DATA_KEY = "data:" + DATA_BUILD;
  var IDB_CHUNK_NS = "chunk:" + DATA_BUILD + ":";
  var CHUNK_SIZE = 2 * 1024 * 1024;   // 2 MiB resumable chunks
  var CONCURRENCY = 4;                // parallel range requests per part

  var PART_URLS = PART_NAMES.map(function (n) { return new URL(n, BASE).href; });
  var PART_FETCH_URLS = PART_NAMES.map(function (n) {
    return new URL(n + "?v=" + encodeURIComponent(DATA_BUILD), BASE).href;
  });

  var loaderUrl = BASE + "u6_mian_brotli.loader.js";
  var frameworkUrl = BASE + "u6_mian_brotli.framework.js.unityweb";
  var codeUrl = BASE + "u6_mian_brotli.wasm.unityweb";

  // ---- loading UI --------------------------------------------------------
  var t0 = performance.now();
  var tickId = null;

  requestAnimationFrame(function () { loadingEl.classList.add("in"); });

  function secs() { return ((performance.now() - t0) / 1000).toFixed(1) + "s"; }
  function fmtMB(b) { return (b / (1024 * 1024)).toFixed(1) + " MB"; }

  function fmtTime(s) {
    if (!isFinite(s) || s <= 0) return null;
    s = Math.round(s);
    if (s < 60) return s + "s";
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m + "m " + (r < 10 ? "0" : "") + r + "s";
  }

  // status = the one quiet line; meta = the numbers underneath.
  function state(main, meta) {
    statusEl.textContent = main;
    if (meta !== undefined) subEl.textContent = meta || "";
  }

  function setSub(meta) { subEl.textContent = meta || ""; }

  function setBar(fraction) {
    trackEl.classList.remove("indeterminate");
    fillEl.style.width = (Math.max(0, Math.min(1, fraction)) * 100).toFixed(2) + "%";
  }

  function setIndeterminate() {
    trackEl.classList.add("indeterminate");
    fillEl.style.width = "";
  }

  function tick(fn) {
    stopTick();
    setSub(fn());
    tickId = setInterval(function () { setSub(fn()); }, 250);
  }

  function stopTick() {
    if (tickId) { clearInterval(tickId); tickId = null; }
  }

  function hideLoader() {
    stopTick();
    loadingEl.classList.add("out");
    setTimeout(function () { loadingEl.style.display = "none"; }, 600);
  }

  // ---- IndexedDB ---------------------------------------------------------
  var idbPromise = null;
  var idbOk = true;
  var memChunks = [[], []];

  function idbOpen() {
    if (!idbPromise) {
      idbPromise = new Promise(function (resolve, reject) {
        if (typeof indexedDB === "undefined") { reject(new Error("indexedDB unavailable")); return; }
        var req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = function () {
          var db = req.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
        };
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error || new Error("indexedDB open failed")); };
        req.onblocked = function () { reject(new Error("indexedDB blocked")); };
      });
    }
    return idbPromise;
  }

  function idbGet(key) {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(IDB_STORE, "readonly");
        var r = tx.objectStore(IDB_STORE).get(key);
        r.onsuccess = function () { resolve(r.result === undefined ? null : r.result); };
        r.onerror = function () { reject(r.error); };
      });
    });
  }

  function idbGetMany(keys) {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(IDB_STORE, "readonly");
        var st = tx.objectStore(IDB_STORE);
        var out = new Array(keys.length);
        keys.forEach(function (k, i) {
          var r = st.get(k);
          r.onsuccess = function () { out[i] = r.result || null; };
        });
        tx.oncomplete = function () { resolve(out); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }

  function idbPut(key, value) {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(IDB_STORE, "readwrite");
        tx.objectStore(IDB_STORE).put(value, key);
        tx.oncomplete = function () { resolve(true); };
        tx.onerror = function () { reject(tx.error); };
        tx.onabort = function () { reject(tx.error || new Error("transaction aborted")); };
      });
    });
  }

  function idbDelete(keys) {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(IDB_STORE, "readwrite");
        var st = tx.objectStore(IDB_STORE);
        keys.forEach(function (k) { st.delete(k); });
        tx.oncomplete = function () { resolve(true); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }

  function idbAllKeys() {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(IDB_STORE, "readonly");
        var r = tx.objectStore(IDB_STORE).getAllKeys();
        r.onsuccess = function () { resolve(r.result || []); };
        r.onerror = function () { reject(r.error); };
      });
    });
  }

  function cacheReady() {
    return (typeof caches !== "undefined") && (typeof Response !== "undefined") && window.isSecureContext;
  }

  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(function () {});
  }
  if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      regs.forEach(function (r) { r.unregister(); });
    }).catch(function () {});
  }

  // ---- stored archive ----------------------------------------------------
  function readIndexedArchive() {
    return idbGet(IDB_DATA_KEY).then(function (rec) {
      if (rec && rec.blob && rec.size === TOTAL_BYTES) return { blob: rec.blob, source: "IndexedDB" };
      if (rec) idbDelete([IDB_DATA_KEY]).catch(function () {});
      return null;
    }).catch(function (err) {
      log("IndexedDB read failed", err);
      return null;
    });
  }

  function readCacheStorageArchive() {
    if (!cacheReady()) return Promise.resolve(null);
    var archiveKey = new URL("__goi_game_data." + DATA_BUILD + ".bin", BASE).href;
    return caches.keys().then(function (names) {
      return Promise.all(names.map(function (name) {
        return caches.open(name).then(function (cache) {
          return Promise.all([
            cache.match(archiveKey),
            cache.match(PART_URLS[0], { ignoreSearch: true }),
            cache.match(PART_URLS[1], { ignoreSearch: true })
          ]).then(function (hits) {
            if (hits[0]) {
              return hits[0].blob().then(function (blob) {
                if (blob.size === TOTAL_BYTES) return { blob: blob, source: "Cache Storage" };
                return cache.delete(archiveKey).then(function () { return null; });
              });
            }
            if (hits[1] && hits[2]) {
              return Promise.all([hits[1].blob(), hits[2].blob()]).then(function (bs) {
                if (bs[0].size + bs[1].size !== TOTAL_BYTES) return null;
                return { blob: new Blob(bs, { type: "application/octet-stream" }), source: "saved parts" };
              });
            }
            return null;
          });
        }).catch(function () { return null; });
      })).then(function (results) {
        for (var i = 0; i < results.length; i++) if (results[i]) return results[i];
        return null;
      });
    }).catch(function () { return null; });
  }

  // ---- chunks ------------------------------------------------------------
  function partChunkCount(part) { return Math.ceil(PART_SIZES[part] / CHUNK_SIZE); }
  function chunkKey(part, i) { return IDB_CHUNK_NS + part + ":" + i; }
  function chunkExpectedSize(part, i) {
    return Math.min(PART_SIZES[part], (i + 1) * CHUNK_SIZE) - i * CHUNK_SIZE;
  }

  function existingChunks(part) {
    var count = partChunkCount(part);
    var keys = [];
    for (var i = 0; i < count; i++) keys.push(chunkKey(part, i));
    memChunks[part] = [];
    return idbGetMany(keys).then(function (recs) {
      var bytes = 0;
      var filled = 0;
      for (var i = 0; i < recs.length; i++) {
        var r = recs[i];
        if (!r || !r.byteLength || r.byteLength !== chunkExpectedSize(part, i)) break;
        memChunks[part].push(r);
        bytes += r.byteLength;
        filled++;
      }
      return { filled: filled, bytes: bytes };
    }).catch(function (err) {
      log("IndexedDB chunk read failed; resume disabled", err);
      idbOk = false;
      memChunks[part] = [];
      return { filled: 0, bytes: 0 };
    });
  }

  function storeChunk(part, idx, buf) {
    memChunks[part][idx] = buf;
    if (!idbOk) return Promise.resolve(false);
    return idbPut(chunkKey(part, idx), buf).catch(function (err) {
      log("IndexedDB chunk write failed; continuing without resume", err);
      idbOk = false;
      return false;
    });
  }

  function fetchRange(url, start, end, attempt) {
    attempt = attempt || 1;
    return fetch(url, { headers: { "Range": "bytes=" + start + "-" + end } })
      .then(function (res) {
        if (res.status === 206) return res.arrayBuffer();
        if (res.status === 200) {
          var err = new Error("server ignored Range");
          err.noRange = true;
          throw err;
        }
        throw new Error("HTTP " + res.status);
      })
      .catch(function (err) {
        if (err.noRange) throw err;
        if (attempt >= 3) throw err;
        return new Promise(function (r) { setTimeout(r, 300 * attempt); })
          .then(function () { return fetchRange(url, start, end, attempt + 1); });
      });
  }

  function downloadPartWhole(part, onProgress) {
    var size = PART_SIZES[part];
    var url = PART_FETCH_URLS[part];
    var count = partChunkCount(part);
    var have = 0;
    return fetch(url).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.arrayBuffer();
    }).then(function (buf) {
      var chain = Promise.resolve();
      for (var i = 0; i < count; i++) {
        (function (idx) {
          chain = chain.then(function () {
            var s = idx * CHUNK_SIZE;
            var e = Math.min(size, s + CHUNK_SIZE);
            var slice = buf.slice(s, e);
            return storeChunk(part, idx, slice).then(function () {
              have += slice.byteLength;
              onProgress(part, have, false);
            });
          });
        })(i);
      }
      return chain;
    });
  }

  function downloadPart(part, onProgress) {
    var size = PART_SIZES[part];
    var url = PART_FETCH_URLS[part];
    var count = partChunkCount(part);

    return existingChunks(part).then(function (st) {
      if (st.filled >= count) {
        onProgress(part, st.bytes, true);
        return;
      }

      var next = st.filled;
      var have = st.bytes;
      onProgress(part, have, next > 0);

      function worker() {
        if (next >= count) return Promise.resolve();
        var idx = next++;
        var start = idx * CHUNK_SIZE;
        var end = Math.min(size, start + CHUNK_SIZE) - 1;
        return fetchRange(url, start, end).then(function (buf) {
          return storeChunk(part, idx, buf).then(function () {
            have += buf.byteLength;
            onProgress(part, have, false);
            return worker();
          });
        });
      }

      var workers = [];
      for (var i = 0; i < CONCURRENCY; i++) workers.push(worker());

      return Promise.all(workers).catch(function (err) {
        if (err && err.noRange) {
          log("range requests unsupported — falling back to single stream");
          memChunks[part] = [];
          return downloadPartWhole(part, onProgress);
        }
        throw err;
      });
    });
  }

  function assembleArchive() {
    var parts = [0, 1].map(function (part) {
      var count = partChunkCount(part);
      var list = memChunks[part];
      if (list.length === count && list.every(function (b) { return b && b.byteLength; })) {
        return new Blob(list);
      }
      var keys = [];
      for (var i = 0; i < count; i++) keys.push(chunkKey(part, i));
      return idbGetMany(keys).then(function (recs) {
        if (recs.length !== count || recs.some(function (r) { return !r || !r.byteLength; })) {
          throw new Error("missing chunk data for part " + part);
        }
        return new Blob(recs);
      });
    });
    return Promise.all(parts).then(function (blobs) {
      return new Blob(blobs, { type: "application/octet-stream" });
    });
  }

  function persistArchive(blob) {
    return idbPut(IDB_DATA_KEY, { blob: blob, size: blob.size, build: DATA_BUILD, savedAt: Date.now() })
      .then(function () {
        log("archive stored (" + fmtMB(blob.size) + ")");
        if (cacheReady()) {
          var archiveKey = new URL("__goi_game_data." + DATA_BUILD + ".bin", BASE).href;
          caches.open("goi-data-v1").then(function (c) { c.delete(archiveKey); }).catch(function () {});
        }
        return true;
      })
      .catch(function (err) {
        log("IndexedDB store failed", err);
        return false;
      });
  }

  function clearChunks() {
    var cleanup = idbAllKeys().then(function (keys) {
      var doomed = keys.filter(function (k) { return typeof k === "string" && k.indexOf("chunk:") === 0; });
      if (doomed.length) return idbDelete(doomed);
    }).catch(function () {});
    return cleanup.then(function () { memChunks = [[], []]; });
  }

  // ---- boot --------------------------------------------------------------
  function boot(dataUrl, cached) {
    var config = {
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
      arguments: [],
      dataUrl: dataUrl,
      frameworkUrl: frameworkUrl,
      codeUrl: codeUrl,
      streamingAssetsUrl: "StreamingAssets",
      fullscreenElementID: "unity-fullscreen-container",
      companyName: "Bennett Foddy",
      productName: "Getting Over It",
      productVersion: "1.7",
      showBanner: function (msg) {
        var el = document.querySelector("#unity-warning");
        el.style.display = "block";
        el.textContent = msg;
        setTimeout(function () { el.style.display = "none"; }, 6000);
      }
    };

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      var startedEngine = performance.now();

      if (cached) {
        setIndeterminate();
        state("starting from saved copy", "no download · " + SIZE_MB + " MB");
        tick(function () { return "unpacking · " + secs(); });
      } else {
        setBar(1);
        state("starting", "engine · " + secs());
      }

      createUnityInstance(canvas, config, function (progress) {
        var n = Math.max(0, Math.min(100, Math.round(progress * 100)));
        if (cached) {
          state("unpacking", "no download · " + n + "%");
        } else {
          setBar(progress);
          state("starting", "engine · " + n + "%");
        }
      }).then(function () {
        stopTick();
        log("timeline: engine " + Math.round(performance.now() - startedEngine) + " ms · total " + secs());
        hideLoader();
      }).catch(function (message) {
        stopTick();
        setBar(0);
        state("failed to load", message);
      });
    };
    script.onerror = function () {
      stopTick();
      state("engine script unreachable", loaderUrl);
    };
    document.body.appendChild(script);
  }

  // ---- flow --------------------------------------------------------------
  function startFromCache(hit) {
    var lookupMs = Math.round(performance.now() - t0);
    setIndeterminate();
    state("saved copy found", SIZE_MB + " MB · cache " + lookupMs + " ms");
    log("cache HIT " + lookupMs + " ms · " + hit.source + " · " + fmtMB(hit.blob.size) + " · zero network requests");
    boot(URL.createObjectURL(hit.blob), true);
  }

  function startDownload() {
    var partBytes = [0, 0];
    var resumed = false;
    var samples = [];

    setBar(0);
    state("downloading", "0.0 MB of " + SIZE_MB + " MB");

    function speed() {
      if (samples.length < 2) return 0;
      var first = samples[0];
      var last = samples[samples.length - 1];
      var dt = (last.t - first.t) / 1000;
      return dt > 0 ? (last.b - first.b) / dt : 0;
    }

    var painter = setInterval(function () {
      var total = partBytes[0] + partBytes[1];
      var now = performance.now();
      samples.push({ t: now, b: total });
      while (samples.length > 2 && now - samples[0].t > 3000) samples.shift();

      var frac = Math.min(1, total / TOTAL_BYTES);
      setBar(frac);

      var sp = speed();
      var pct = Math.round(frac * 100);
      state((resumed ? "resuming" : "downloading") + " · " + pct + "%",
            fmtMB(total) + " of " + SIZE_MB + " MB" +
            (sp > 0 ? " · " + (sp / (1024 * 1024)).toFixed(1) + " MB/s · " + (fmtTime((TOTAL_BYTES - total) / sp) || "—") + " left" : ""));
    }, 250);

    function stopPainter() {
      if (painter) { clearInterval(painter); painter = null; }
    }

    return Promise.all([0, 1].map(function (part) {
      return downloadPart(part, function (p, bytes, wasResumed) {
        partBytes[p] = bytes;
        if (wasResumed && bytes > 0) resumed = true;
      });
    })).then(function () {
      stopPainter();
      setBar(1);
      state("preparing", fmtMB(TOTAL_BYTES) + " · saved for next time");
      return assembleArchive();
    }).then(function (blob) {
      if (blob.size !== TOTAL_BYTES) {
        throw new Error("assembled " + blob.size + " bytes, expected " + TOTAL_BYTES);
      }
      boot(URL.createObjectURL(blob), false);
      return persistArchive(blob).then(function (ok) {
        if (ok) {
          log("cache STORED — next load downloads nothing");
          clearChunks();
        } else {
          log("cache STORE FAILED — browser refused IndexedDB");
        }
      });
    }).catch(function (err) {
      stopPainter();
      setBar(0);
      state("download failed", (err && err.message ? err.message : String(err)) + " · reload to resume");
      log("download failed — chunks kept, reload to resume", err);
    });
  }

  // Preload the tiny engine script while the data streams in.
  try {
    var pre = document.createElement("link");
    pre.rel = "preload";
    pre.as = "script";
    pre.href = loaderUrl;
    document.head.appendChild(pre);
  } catch (e) {}

  log("build " + DATA_BUILD + " · " + (CHUNK_SIZE / (1024 * 1024)) + " MB chunks · " + CONCURRENCY + " parallel");

  setIndeterminate();
  state("checking", "saved game data");

  readIndexedArchive().then(function (hit) {
    return hit || readCacheStorageArchive();
  }).then(function (hit) {
    if (hit) return startFromCache(hit);
    return startDownload();
  }).catch(function (err) {
    setBar(0);
    state("startup failed", err && err.message ? err.message : String(err));
    log("startup failed", err);
  });
</script>
</body>
</html>
